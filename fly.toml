# fly.toml app configuration file generated for williamos-api on 2026-08-19T22:36:51+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'williamos-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCUMENTS_BUCKET = 'documents'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
